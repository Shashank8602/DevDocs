services:
  postgres:
    image: postgres:16
    container_name: devdocs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devdocs}
      POSTGRES_DB: ${POSTGRES_DB:-devdocs}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devdocs} -d ${POSTGRES_DB:-devdocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: devdocs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  esdata:
